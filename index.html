<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <title>Minimal Admin Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="style.css">
</head>

<body class="app">
  <header class="header">
    <div class="logo">Admin Panel</div>
    <button class="theme-toggle" id="themeToggle">☀️</button>
  </header>

  <aside class="sidebar">
    <nav>
      <a href="#" class="active">Dashboard</a>
      <a href="#">Users</a>
      <a href="#">Reports</a>
      <a href="#">Settings</a>
    </nav>
  </aside>

  <main class="main">
  <div class="cards">
    <div class="card">Total Users</div>
    <div class="card">Revenue</div>
    <div class="card">Active Sessions</div>
  </div>

  <div class="grid-widgets">
    <div class="widget">Errors</div>
    <div class="widget">Sales Chart</div>
    <div class="widget">Top Countries</div>
    <div class="widget widget--wide">Recent Activity & Server Status</div>
  </div>
</main>


  <footer class="footer">
    © 2026 Student Admin Dashboard
  </footer>

  <script src="theme.js"></script>
</body>
</html>
